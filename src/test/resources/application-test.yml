spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    managementUrl: "http://localhost:15672/"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
#        show_sql: true
#        use_sql_comment: true
        highlight_sql: true

logging:
  level.org.hibernate:
#    SQL: DEBUG
    orm.jdbc.bind: TRACE



datasource:
  prod:
    rabbitmq:
      managementUrl: http://localhost:15672/